name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  start-script:
    name: ./start.sh on a fresh clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the app the way the grader does
        run: |
          ./start.sh > start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          cat start.log
          exit 1
      - name: Pages load and login is required
        run: |
          curl -fsS http://localhost:3000/ | grep -q "Grade Tracker"
          curl -fsS http://localhost:3000/login | grep -q 'action="/register"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/courses)" = "302"
